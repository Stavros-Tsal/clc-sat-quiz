<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 1 · Part 2</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']],processEscapes:true}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js"></script>
<style>
:root{--ink:#14213d;--blue:#1d4ed8;--navy:#0f2a5c;--pale:#eef3fb;--line:#c9d6ec;--ok:#0f7b45;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:17px/1.6 Georgia,'Times New Roman',serif}
header{background:var(--navy);color:#fff;padding:22px 20px 18px}
header .in{max-width:820px;margin:auto}
header .who{font:600 15px/1.2 system-ui,sans-serif;opacity:.85;margin-bottom:8px}
header h1{margin:0;font-size:28px;font-weight:700}
header p{margin:6px 0 0;font:14px system-ui,sans-serif;opacity:.8}
main{max-width:820px;margin:0 auto;padding:22px 16px 90px}
.sec{font:600 15px system-ui,sans-serif;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.q.right{border-left:6px solid var(--ok)}.q.wrong{border-left:6px solid var(--bad)}
.n{font:700 14px system-ui,sans-serif;color:var(--blue);margin-bottom:4px}
.txt{margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--pale)}
.opt input{margin:0}.opt b{font:700 14px system-ui,sans-serif;color:var(--navy);width:16px}
.opt.sel{border-color:var(--blue);background:#e6eeff}
.opt.key{border-color:var(--ok);background:#e5f6ec}
.open input[type=text]{font:16px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:220px}
.open small{display:block;color:#5b6b8c;font:13px system-ui,sans-serif;margin-top:4px}
.fb{font:14px system-ui,sans-serif;margin-top:8px}.fb.r{color:var(--ok)}.fb.w{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;justify-content:center;align-items:center;font:15px system-ui,sans-serif}
button{font:600 15px system-ui,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button:focus-visible,input:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
#score{font-weight:700;color:var(--navy)}
table{border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:5px 14px;text-align:center}
@media print{.bar{display:none}}
</style></head><body>
<header><div class="in"><div class="who">Tsalapatis Stavros</div><h1>Module 1 · Part 2</h1>
<p>SAT Math · Module 1 practice · 22 questions · 35 minutes · calculator allowed</p></div></header>
<main id="m"></main>
<div class="bar"><span id="prog">0 / 22 answered</span><button id="chk">Check answers</button><button class="alt" id="rst">Reset</button><span id="score"></span></div>
<script>
const Q=[{"q": "If $8x + 12 = 84$, what is the value of $16x + 24$?", "open": true, "ans": "168"}, {"q": "Solve the system: 3x + 2y = 16 and 5x − 2y = 0. What is the value of x + y?", "ans": "7", "open": true}, {"q": "If $|4x-4|=8$ and $|5y+10|=15$, what is the smallest possible value of $xy$?", "ans": "B", "opts": ["$-20$", "$-15$", "$-5$", "$-1$"]}, {"q": "For what value of b does the system 6x − 2y = 10 and 9x − 3y = b have infinitely many solutions?", "ans": "15", "open": true}, {"q": "In the system of equations below, $k$ is a constant.<br>$$\\dfrac12 x - \\dfrac34 y = 2$$$$kx-\\dfrac92 y=10$$For what value of $k$ does the system of equations have no solution?", "ans": "C", "opts": ["-3", "$\\dfrac{3}{2}$", "3", "9"]}, {"q": "Line $k$ has a slope of $-\\dfrac{5}{6}$ and an $x$-intercept of $\\left(\\dfrac{p}{2}, 0\\right)$, where $p$ is a constant. What is the $y$-coordinate of the $y$-intercept of line $k$ in terms of $p$?", "ans": "B", "opts": ["$-\\dfrac{5p}{12}$", "$\\dfrac{5p}{12}$", "$-\\dfrac{4p}{5}$", "$\\dfrac{4p}{5}$"]}, {"q": "Students and chaperones from a middle school are going on a field trip to a museum. Admission will cost \\$8.50 for each student and \\$12 for each chaperone. It will cost a total of \\$730 for admission for all 83 people on the trip. How many students are going on the field trip?", "ans": "C", "opts": ["31", "70", "76", "86"]}, {"q": "Tickets to a concert sell for \\$47 each for the first 25 people. After the first 25 tickets are sold, any remaining tickets sell for \\$65 each. Let $n$ represent the total number of people who buy tickets, where $n > 25$. Which of the following equations models the total revenue, in dollars, from ticket sales?", "ans": "A", "opts": ["$65n - 450$", "$65n + 1175$", "$47n + 65$", "$112n + 1175$"]}, {"q": "If w@z is equivalent to 3w − z, what is the value of (w@z)@z?", "ans": "B", "opts": ["3w − 2z", "9w − 4z", "9w − 3z", "9w − 2z"]}, {"q": "If p&q is equivalent to p/q + pq, what is the value of q&p when p = 4 and q = −2?", "ans": "B", "opts": ["−10", "−8.5", "−7.5", "16"]}, {"q": "For a polynomial $p(x)$, $p(2)=0$. Which of the following must be true about $p(x)$?", "ans": "C", "opts": ["$2x$ is a factor of $p(x)$.", "$2x-2$ is a factor of $p(x)$.", "$x-2$ is a factor of $p(x)$.", "$x+2$ is a factor of $p(x)$."]}, {"q": "$$y=\\dfrac{x+1}{x-1}$$<br>Which of the following points in the $xy$-plane is NOT on the graph of $y$?", "ans": "D", "opts": ["$\\left(-2,\\dfrac{1}{3}\\right)$", "$(-1,0)$", "$(0,-1)$", "$(1,2)$"]}, {"q": "For a polynomial $p(x)$, $p\\left(\\dfrac{1}{3}\\right)=0$. Which of the following must be a factor of $p(x)$?", "ans": "A", "opts": ["$3x-1$", "$3x+1$", "$x-3$", "$x+3$"]}, {"q": "The functions $f$ and $g$ are defined by $f(x) = x^2 + 1$ and $g(x) = x^2 - 1$. What is the value of $f(g(2))$?", "ans": "C", "opts": ["3", "5", "10", "17"]}, {"q": "If $x-1$ and $x+1$ are both factors of the polynomial $ax^4+bx^3-3x^2+5x$ and $a$ and $b$ are constants, what is the value of $a$?", "ans": "C", "opts": ["$-3$", "$1$", "$3$", "$5$"]}, {"q": "The quadratic equation $2x^2+24x+k=0$, where $k$ is a constant, has no real solutions if $b<k$. What is the least possible value of $b$?", "ans": "72", "open": true}, {"q": "Data Set A: 19,19,21,21,23,24,24. Data Set B: 1,1,3,3,5,6,6. If $x$ = SD of A and $y$ = SD of B, which is true?", "ans": "B", "opts": ["$x > y$", "$x = y$", "$x < y$", "Cannot be determined"]}, {"q": "If the size of the parking lot is 270 square feet, how many square yards is it? ($1\\\\text{ yard}=3\\\\text{ feet}$)", "ans": "A", "opts": ["30 square yard", "90 square yard", "810 square yard", "2430 square yard"]}, {"q": "What percent of 240 is 60?", "ans": "B", "opts": ["22%", "25%", "27%", "29%"]}, {"q": "In right triangle $ABC$, the right angle is at $B$, $AB = 36$, and $\\cos A = \\dfrac{12}{13}$. What is the length of $BC$?", "opts": ["15", "21", "27", "33"], "ans": "A"}, {"q": "A right circular cylinder has a radius of 5 centimeters and a volume of $300\\pi$ cubic centimeters. What is the height, in centimeters, of the cylinder?", "open": true, "ans": "12"}, {"q": "An angle measures $\\dfrac{5\\pi}{6}$ radians. What is the measure of the angle, in degrees?", "opts": ["150", "165", "180", "195"], "ans": "A"}];
const SEC=[[0,'Algebra'],[8,'Advanced Math'],[16,'Problem-Solving and Data Analysis'],[19,'Geometry and Trigonometry']];
const given={};let checked=false;
function num(s){s=String(s).trim().replace(/\u2212/g,'-').replace(/,/g,'');
 let m=s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
 m=s.match(/^-?(\d+)?\.?\d+$/);return m?parseFloat(s):NaN}
function ok(q,g){if(g===undefined||g==='')return false;if(q.open){const a=num(q.ans),b=num(g);return !isNaN(b)&&Math.abs(a-b)<1e-4*Math.max(1,Math.abs(a))}return g===q.ans}
function render(){const m=document.getElementById('m');m.innerHTML='';
 Q.forEach((q,i)=>{const s=SEC.find(x=>x[0]===i);if(s){const h=document.createElement('div');h.className='sec';h.textContent=s[1];m.appendChild(h)}
  const d=document.createElement('div');d.className='q'+(checked?(ok(q,given[i])?' right':' wrong'):'');
  let h='<div class="n">Question '+(i+1)+'</div><div class="txt">'+q.q+'</div>';
  if(q.open){h+='<div class="open"><input type="text" inputmode="decimal" autocomplete="off" data-i="'+i+'" value="'+(given[i]||'')+'" '+(checked?'disabled':'')+' aria-label="Answer to question '+(i+1)+'"><small>Student-produced response. Fractions and decimals are accepted.</small></div>'}
  else{q.opts.forEach((o,k)=>{const L='ABCD'[k];const cls='opt'+(given[i]===L?' sel':'')+(checked&&q.ans===L?' key':'');
   h+='<label class="'+cls+'"><input type="radio" name="q'+i+'" data-i="'+i+'" value="'+L+'" '+(given[i]===L?'checked':'')+' '+(checked?'disabled':'')+'><b>'+L+'</b><span>'+o+'</span></label>'})}
  if(checked){const r=ok(q,given[i]);h+='<div class="fb '+(r?'r':'w')+'">'+(r?'Correct.':'Incorrect.')+' Answer: '+(q.open?q.ans:q.ans)+'</div>'}
  d.innerHTML=h;m.appendChild(d)});
 bind();typeset();prog()}
function bind(){document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{given[e.dataset.i]=e.value;render()});
 document.querySelectorAll('input[type=text]').forEach(e=>e.oninput=()=>{given[e.dataset.i]=e.value;prog()})}
function prog(){const n=Object.values(given).filter(v=>v!==''&&v!==undefined).length;document.getElementById('prog').textContent=n+' / 22 answered'}
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
document.getElementById('chk').onclick=()=>{checked=true;const c=Q.filter((q,i)=>ok(q,given[i])).length;document.getElementById('score').textContent='Score: '+c+' / 22';render();window.scrollTo(0,0)};
document.getElementById('rst').onclick=()=>{for(const k in given)delete given[k];checked=false;document.getElementById('score').textContent='';render();window.scrollTo(0,0)};
render();window.addEventListener('load',()=>setTimeout(typeset,600));
</script></body></html>
