<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 2 · Part 4</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']],processEscapes:true}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js"></script>
<style>
:root{--ink:#14213d;--blue:#1d4ed8;--navy:#0f2a5c;--pale:#eef3fb;--line:#c9d6ec;--ok:#0f7b45;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:17px/1.6 Georgia,'Times New Roman',serif}
header{background:var(--navy);color:#fff;padding:22px 20px 18px}
header .in{max-width:820px;margin:auto}
header .who{font:600 15px/1.2 system-ui,sans-serif;opacity:.85;margin-bottom:8px}
header h1{margin:0;font-size:28px;font-weight:700}
header p{margin:6px 0 0;font:14px system-ui,sans-serif;opacity:.8}
main{max-width:820px;margin:0 auto;padding:22px 16px 90px}
.sec{font:600 15px system-ui,sans-serif;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.q.right{border-left:6px solid var(--ok)}.q.wrong{border-left:6px solid var(--bad)}
.n{font:700 14px system-ui,sans-serif;color:var(--blue);margin-bottom:4px}
.txt{margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--pale)}
.opt input{margin:0}.opt b{font:700 14px system-ui,sans-serif;color:var(--navy);width:16px}
.opt.sel{border-color:var(--blue);background:#e6eeff}
.opt.key{border-color:var(--ok);background:#e5f6ec}
.open input[type=text]{font:16px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:220px}
.open small{display:block;color:#5b6b8c;font:13px system-ui,sans-serif;margin-top:4px}
.fb{font:14px system-ui,sans-serif;margin-top:8px}.fb.r{color:var(--ok)}.fb.w{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;justify-content:center;align-items:center;font:15px system-ui,sans-serif}
button{font:600 15px system-ui,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button:focus-visible,input:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
#score{font-weight:700;color:var(--navy)}
table{border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:5px 14px;text-align:center}
@media print{.bar{display:none}}
</style></head><body>
<header><div class="in"><div class="who">Tsalapatis Stavros</div><h1>Module 2 · Part 4</h1>
<p>SAT Math · Module 2 practice · 17 questions · calculator allowed</p></div></header>
<main id="m"></main>
<div class="bar"><span id="prog">0 / 17 answered</span><button id="chk">Check answers</button><button class="alt" id="rst">Reset</button><span id="score"></span></div>
<script>
const Q=[{"q":"At a fair, 3 adult tickets and 2 child tickets cost \\$39 in total, and 3 adult tickets and 1 child ticket cost \\$30 in total. What is the total cost, in dollars, of 1 adult ticket and 1 child ticket?","open":true,"ans":"16"},{"q":"$|5x - 30| = 10$ What is the positive difference between the solutions to the given equation?","opts":["4","6","8","9"],"ans":"A"},{"q":"A rental company's charge, in dollars, for driving $m$ miles is given by $C(m) = 3m + 45$. One customer drove a certain number of miles and was charged \\$102. A second customer drove twice as many miles as the first customer. What was the second customer's charge, in dollars?","opts":["121","159","169","204"],"ans":"B"},{"q":"In the $xy$-plane, line $\\ell$ has equation $5x + 6y = 17$. Line $m$ is perpendicular to line $\\ell$ and passes through the point $(10, 0)$. What is the $y$-coordinate of the $y$-intercept of line $m$?","open":true,"ans":"-12"},{"q":"$$K = \\dfrac{1}{2}mv^{2}$$ The given equation relates the positive numbers $K$, $m$, and $v$. Which of the following expresses $m$ in terms of $K$ and $v$?","opts":["$\\dfrac{K}{2v^{2}}$","$\\dfrac{2K}{v}$","$\\dfrac{4K^{2}}{v^{2}}$","$\\dfrac{2K}{v^{2}}$"],"ans":"D"},{"q":"$$k(x + 4) = 3x + 36$$ In the given equation, $k$ is a constant. If $x = 4$ is a solution to the equation, what is the value of $k$?","opts":["6","7","9","36"],"ans":"A"},{"q":"A certain culture of bacteria doubles in number every 30 minutes. At the start of an experiment, there are 120 bacteria in the culture. How many hours after the start of the experiment will there be 30,720 bacteria in the culture?","opts":["3","4","5","6"],"ans":"B"},{"q":"$$8^{4x - 1} = 2^{x + 30}$$ What is the value of $x$ in the given equation?","open":true,"ans":"3"},{"q":"For $x > 6$, which of the following expressions is equivalent to $\\dfrac{x^2 - 36}{x^2 + 7x + 6}$?","opts":["$\\dfrac{x + 6}{x + 1}$","$\\dfrac{x - 6}{x - 1}$","$\\dfrac{x - 6}{x + 6}$","$\\dfrac{x - 6}{x + 1}$"],"ans":"D"},{"q":"$$\\sqrt{3x + 4} = x - 2$$ What is the solution to the given equation?","opts":["7","8","9","10"],"ans":"A"},{"q":"The polynomial $p(x) = x^3 + ax^2 - 3x + 1$, where $a$ is a constant, has $(x + 1)$ as a factor. What is the value of $a$?","open":true,"ans":"-3"},{"q":"In the $xy$-plane, the graph of $y = x^2 - 6x + 5$ intersects the graph of $y = 5$ at two points. What is the sum of the $y$-coordinates of these two points?","opts":["5","6","10","13"],"ans":"C"},{"q":"At a school with 600 students, 60% of the students are in the orchestra. Of the students in the orchestra, 75% are seniors. How many students in the orchestra are not seniors?","open":true,"ans":"90"},{"q":"One class of 25 students had a mean score of 62 on a test, and a second class of 25 students had a mean score of 70 on the same test. What is the mean score of all 50 students?","opts":["66","68","70","72"],"ans":"A"},{"q":"<table class='qtable'><tr><th>Value</th><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr><tr><th>Frequency</th><td>4</td><td>7</td><td>9</td><td>7</td><td>6</td><td>6</td></tr></table>The frequency table shows the distribution of values in a data set. What is the median of the data set?","opts":["3","4","$\\dfrac{9}{2}$","5"],"ans":"B"},{"q":"In right triangle $ABC$, the right angle is at $B$, $AB = 30$ and $\\tan A = \\dfrac{8}{15}$. What is the perimeter of triangle $ABC$?","opts":["64","76","80","82"],"ans":"C"},{"q":"A rectangular box has dimensions 2 inches by 6 inches by 9 inches. What is the length, in inches, of the longest straight line segment that can be drawn between two points on the surface of the box?","opts":["8","9","10","11"],"ans":"D"}];
const SEC=[[0,'Algebra'],[6,'Advanced Math'],[12,'Problem-Solving and Data Analysis'],[15,'Geometry and Trigonometry']];
const given={};let checked=false;
function num(s){s=String(s).trim().replace(/\u2212/g,'-').replace(/,/g,'');
 let m=s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
 m=s.match(/^-?(\d+)?\.?\d+$/);return m?parseFloat(s):NaN}
function ok(q,g){if(g===undefined||g==='')return false;if(q.open){const a=num(q.ans),b=num(g);return !isNaN(b)&&Math.abs(a-b)<1e-4*Math.max(1,Math.abs(a))}return g===q.ans}
function render(){const m=document.getElementById('m');m.innerHTML='';
 Q.forEach((q,i)=>{const s=SEC.find(x=>x[0]===i);if(s){const h=document.createElement('div');h.className='sec';h.textContent=s[1];m.appendChild(h)}
  const d=document.createElement('div');d.className='q'+(checked?(ok(q,given[i])?' right':' wrong'):'');
  let h='<div class="n">Question '+(i+1)+'</div><div class="txt">'+q.q+'</div>';
  if(q.open){h+='<div class="open"><input type="text" inputmode="text" autocomplete="off" data-i="'+i+'" value="'+(given[i]||'')+'" '+(checked?'disabled':'')+' aria-label="Answer to question '+(i+1)+'"><small>Student-produced response. Fractions and decimals are accepted.</small></div>'}
  else{q.opts.forEach((o,k)=>{const L='ABCD'[k];const cls='opt'+(given[i]===L?' sel':'')+(checked&&q.ans===L?' key':'');
   h+='<label class="'+cls+'"><input type="radio" name="q'+i+'" data-i="'+i+'" value="'+L+'" '+(given[i]===L?'checked':'')+' '+(checked?'disabled':'')+'><b>'+L+'</b><span>'+o+'</span></label>'})}
  if(checked){const r=ok(q,given[i]);h+='<div class="fb '+(r?'r':'w')+'">'+(r?'Correct.':'Incorrect.')+' Answer: '+(q.open?q.ans:q.ans)+'</div>'}
  d.innerHTML=h;m.appendChild(d)});
 bind();typeset();prog()}
function bind(){document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{given[e.dataset.i]=e.value;render()});
 document.querySelectorAll('input[type=text]').forEach(e=>e.oninput=()=>{given[e.dataset.i]=e.value;prog()})}
function prog(){const n=Object.values(given).filter(v=>v!==''&&v!==undefined).length;document.getElementById('prog').textContent=n+' / 17 answered'}
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
document.getElementById('chk').onclick=()=>{checked=true;const c=Q.filter((q,i)=>ok(q,given[i])).length;document.getElementById('score').textContent='Score: '+c+' / 17';render();window.scrollTo(0,0)};
document.getElementById('rst').onclick=()=>{for(const k in given)delete given[k];checked=false;document.getElementById('score').textContent='';render();window.scrollTo(0,0)};
render();window.addEventListener('load',()=>setTimeout(typeset,600));
</script></body></html>
