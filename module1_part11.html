<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 1 · Part 11</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']],processEscapes:true}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js"></script>
<style>
:root{--ink:#14213d;--blue:#1d4ed8;--navy:#0f2a5c;--pale:#eef3fb;--line:#c9d6ec;--ok:#0f7b45;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:17px/1.6 Georgia,'Times New Roman',serif}
header{background:var(--navy);color:#fff;padding:22px 20px 18px}
header .in{max-width:820px;margin:auto}
header .who{font:600 15px/1.2 system-ui,sans-serif;opacity:.85;margin-bottom:8px}
header h1{margin:0;font-size:28px;font-weight:700}
header p{margin:6px 0 0;font:14px system-ui,sans-serif;opacity:.8}
main{max-width:820px;margin:0 auto;padding:22px 16px 90px}
.sec{font:600 15px system-ui,sans-serif;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.q.right{border-left:6px solid var(--ok)}.q.wrong{border-left:6px solid var(--bad)}
.n{font:700 14px system-ui,sans-serif;color:var(--blue);margin-bottom:4px}
.txt{margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--pale)}
.opt input{margin:0}.opt b{font:700 14px system-ui,sans-serif;color:var(--navy);width:16px}
.opt.sel{border-color:var(--blue);background:#e6eeff}
.opt.key{border-color:var(--ok);background:#e5f6ec}
.open input[type=text]{font:16px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:220px}
.open small{display:block;color:#5b6b8c;font:13px system-ui,sans-serif;margin-top:4px}
.fb{font:14px system-ui,sans-serif;margin-top:8px}.fb.r{color:var(--ok)}.fb.w{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;justify-content:center;align-items:center;font:15px system-ui,sans-serif}
button{font:600 15px system-ui,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button:focus-visible,input:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
#score{font-weight:700;color:var(--navy)}
table{border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:5px 14px;text-align:center}
@media print{.bar{display:none}}
</style></head><body>
<header><div class="in"><div class="who">Tsalapatis Stavros</div><h1>Module 1 · Part 11</h1>
<p>SAT Math · Module 1 practice · 22 questions · 35 minutes · calculator allowed</p></div></header>
<main id="m"></main>
<div class="bar"><span id="prog">0 / 22 answered</span><button id="chk">Check answers</button><button class="alt" id="rst">Reset</button><span id="score"></span></div>
<script>
const Q=[{"q":"$$mx + ky = -83$$ $$2x + ky = 22$$ In the given system of equations, $m$ and $k$ are constants. The graphs of the two equations in the $xy$-plane intersect at the point $(5, y)$. What is the value of $m$?","ans":"-19","open":true},{"q":"The function $h$ is defined by $h(x) = \\dfrac{2}{3}x - 5$. If $4h(3p+6) - 7 = 5p - 3$, what is the value of $p$?","ans":"A","opts":["$\\dfrac{8}{3}$","$\\dfrac{4}{3}$","$-\\dfrac{4}{3}$","$-\\dfrac{8}{3}$"]},{"q":"In 2010, a team had 35 skaters (advanced $a$ + intermediate $b$). By 2020: advanced +53%, intermediate +44%, total +49%. Which equation fits?","ans":"C","opts":["$1.53a + 1.49b = 35(1.44)$","$1.49a + 0.53b = 35(1.44)$","$1.53a + 1.44b = 35(1.49)$","$1.44a + 1.53b = 35(1.49)$"]},{"q":"A rectangle has a perimeter of 66 centimeters. Its length is 3 centimeters more than twice its width. What is the width, in centimeters, of the rectangle?","open":true,"ans":"10"},{"q":"$$9(x-9)+4=tx+27$$ In the given equation, $t$ is a positive integer. If the given equation has exactly one solution, what CANNOT be the value of $t$?","ans":"B","opts":["4","9","23","28"]},{"q":"A student has a budget of \\$250 for a class trip. The trip has a fixed booking fee of \\$25, and each activity ticket costs \\$7. What is the greatest number of activity tickets the student can buy without going over the budget?","opts":["29","30","31","32"],"ans":"D"},{"q":"A hot dog factory must ensure that its hot dogs are between $6\\dfrac{1}{4}$ inches and $6\\dfrac{3}{4}$ inches in length. If $h$ is the length of a hot dog from this factory, then which of the following inequalities correctly expresses the accepted values of $h$?","ans":"C","opts":["$\\left|h-6\\dfrac{1}{4}\\right|<\\dfrac{1}{4}$","$\\left|h-6\\dfrac{1}{4}\\right|<\\dfrac{1}{2}$","$\\left|h-6\\dfrac{1}{2}\\right|<\\dfrac{1}{4}$","$\\left|h-6\\dfrac{1}{2}\\right|>\\dfrac{1}{4}$"]},{"q":"A yoga studio is offering a deal where the first session is free, the second session is half off the regular price, and the remaining sessions are at the regular price. If the regular price of a session is \\$25.40, which function $f$ gives the total cost, in dollars, of purchasing $x$ sessions using this deal, where $x > 2$?","ans":"B","opts":["$f(x)=25.40(x-1)+12.70$","$f(x)=25.40(x-2)+12.70$","$f(x)=25.40(x-1)+12.70(x-2)$","$f(x)=25.40(x-2)+12.70(x-1)$"]},{"q":"Which expression is equivalent to $\\dfrac{42a}{k} + 42ak$, where $k > 0$?","ans":"D","opts":["$\\dfrac{84a}{k}$","$\\dfrac{84ak^2}{k}$","$\\dfrac{42a(k+1)}{k}$","$\\dfrac{42a(k^2+1)}{k}$"]},{"q":"The expression $2x^2-4x-3$ can be written as $A(x+1)+B$, where $B$ is a constant. What is $A$ in terms of $x$?","ans":"D","opts":["$2x+6$","$2x+2$","$2x-2$","$2x-6$"]},{"q":"The expression $\\dfrac13 x^2 - 2$ can be rewritten as $\\dfrac13(x-k)(x+k)$, where $k$ is a positive constant. What is the value of $k$?","ans":"D","opts":["$2$","$6$","$\\sqrt2$","$\\sqrt6$"]},{"q":"The expression $\\dfrac{29x+102}{x+81}$ is equivalent to $p+\\dfrac{w}{x+81}$, where $p$ and $w$ are constants. What is the value of $w$?","ans":"-2247","open":true},{"q":"The expression $(3x-23)(19x+6)$ is equivalent to the expression $ax^2+bx+c$, where $a$, $b$, and $c$ are constants. What is the value of $b$?","ans":"-419","open":true},{"q":"$2x^2 - 4x = t$<br>In the equation above, $t$ is a constant. If the equation has no real solutions, which of the following could be the value of $t$?","ans":"A","opts":["$-3$","$-1$","$1$","$3$"]},{"q":"The function $f$ is defined by $f(x)=3x^2$. In the $xy$-plane, the graph of $y=g(x)$ is the result of shifting the graph of $y=f(x)$ up 4 units. Which equation defines the function $g$?","ans":"A","opts":["$g(x)=3x^2+4$","$g(x)=3x^2-4$","$g(x)=3x^2$","$g(x)=12x^2$"]},{"q":"<table style='border-collapse:collapse;margin:10px 0;'><tr><th style='border:1px solid #ccc;padding:6px 12px;'>$x$</th><th style='border:1px solid #ccc;padding:6px 12px;'>0</th><th style='border:1px solid #ccc;padding:6px 12px;'>1</th><th style='border:1px solid #ccc;padding:6px 12px;'>2</th></tr><tr><th style='border:1px solid #ccc;padding:6px 12px;'>$f(x)$</th><td style='border:1px solid #ccc;padding:6px 12px;'>$-2$</td><td style='border:1px solid #ccc;padding:6px 12px;'>3</td><td style='border:1px solid #ccc;padding:6px 12px;'>18</td></tr></table>Several values of the function $f$ are given in the table above. If $f(x) = ax^2 + b$ where $a$ and $b$ are constants, what is the value of $f(3)$?","ans":"C","opts":["23","39","43","56"]},{"q":"Principal surveys 200 students: 43% say online learning is effective, margin of error ±5%. The percentage of all students who agree is between:","ans":"A","opts":["38% and 48%","27% and 59%","35% and 51%","41% and 45%"]},{"q":"Jason averaged 60 miles per hour on a trip. Which of the following is Jason's speed in feet per second? ($1\\text{ mile}=5280\\text{ feet}$)","ans":"D","opts":["76 feet per second","80 feet per second","84 feet per second","88 feet per second"]},{"q":"If one US dollar is equal to 130 Japanese yen, how many dollars can you buy with 5200 yen?","ans":"B","opts":["\\$38","\\$40","\\$45","\\$52"]},{"q":"A square with a side length of 8 has a circle of diameter 8 removed from its center. What is the area of the remaining region?","opts":["$64 - 8\\pi$","$64 - 16\\pi$","$64 - 32\\pi$","$64 - 64\\pi$"],"ans":"B"},{"q":"At the same time of day, a 6-foot-tall person casts a 4-foot shadow and a tree casts a 22-foot shadow. Assuming the person and the tree are both vertical, what is the height, in feet, of the tree?","opts":["18","23","28","33"],"ans":"D"},{"q":"Lines $\\ell$ and $m$ are parallel and are cut by a transversal. Two corresponding angles measure $(3x+12)^\\circ$ and $(5x-28)^\\circ$. What is the measure, in degrees, of each of these angles?","opts":["64","72","80","88"],"ans":"B"}];
const SEC=[[0,'Algebra'],[8,'Advanced Math'],[16,'Problem-Solving and Data Analysis'],[19,'Geometry and Trigonometry']];
const given={};let checked=false;
function num(s){s=String(s).trim().replace(/\u2212/g,'-').replace(/,/g,'');
 let m=s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
 m=s.match(/^-?(\d+)?\.?\d+$/);return m?parseFloat(s):NaN}
function ok(q,g){if(g===undefined||g==='')return false;if(q.open){const a=num(q.ans),b=num(g);return !isNaN(b)&&Math.abs(a-b)<1e-4*Math.max(1,Math.abs(a))}return g===q.ans}
function render(){const m=document.getElementById('m');m.innerHTML='';
 Q.forEach((q,i)=>{const s=SEC.find(x=>x[0]===i);if(s){const h=document.createElement('div');h.className='sec';h.textContent=s[1];m.appendChild(h)}
  const d=document.createElement('div');d.className='q'+(checked?(ok(q,given[i])?' right':' wrong'):'');
  let h='<div class="n">Question '+(i+1)+'</div><div class="txt">'+q.q+'</div>';
  if(q.open){h+='<div class="open"><input type="text" inputmode="decimal" autocomplete="off" data-i="'+i+'" value="'+(given[i]||'')+'" '+(checked?'disabled':'')+' aria-label="Answer to question '+(i+1)+'"><small>Student-produced response. Fractions and decimals are accepted.</small></div>'}
  else{q.opts.forEach((o,k)=>{const L='ABCD'[k];const cls='opt'+(given[i]===L?' sel':'')+(checked&&q.ans===L?' key':'');
   h+='<label class="'+cls+'"><input type="radio" name="q'+i+'" data-i="'+i+'" value="'+L+'" '+(given[i]===L?'checked':'')+' '+(checked?'disabled':'')+'><b>'+L+'</b><span>'+o+'</span></label>'})}
  if(checked){const r=ok(q,given[i]);h+='<div class="fb '+(r?'r':'w')+'">'+(r?'Correct.':'Incorrect.')+' Answer: '+(q.open?q.ans:q.ans)+'</div>'}
  d.innerHTML=h;m.appendChild(d)});
 bind();typeset();prog()}
function bind(){document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{given[e.dataset.i]=e.value;render()});
 document.querySelectorAll('input[type=text]').forEach(e=>e.oninput=()=>{given[e.dataset.i]=e.value;prog()})}
function prog(){const n=Object.values(given).filter(v=>v!==''&&v!==undefined).length;document.getElementById('prog').textContent=n+' / 22 answered'}
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
document.getElementById('chk').onclick=()=>{checked=true;const c=Q.filter((q,i)=>ok(q,given[i])).length;document.getElementById('score').textContent='Score: '+c+' / 22';render();window.scrollTo(0,0)};
document.getElementById('rst').onclick=()=>{for(const k in given)delete given[k];checked=false;document.getElementById('score').textContent='';render();window.scrollTo(0,0)};
render();window.addEventListener('load',()=>setTimeout(typeset,600));
</script></body></html>
