<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 1 · Part 12</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']],processEscapes:true}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js"></script>
<style>
:root{--ink:#14213d;--blue:#1d4ed8;--navy:#0f2a5c;--pale:#eef3fb;--line:#c9d6ec;--ok:#0f7b45;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:17px/1.6 Georgia,'Times New Roman',serif}
header{background:var(--navy);color:#fff;padding:22px 20px 18px}
header .in{max-width:820px;margin:auto}
header .who{font:600 15px/1.2 system-ui,sans-serif;opacity:.85;margin-bottom:8px}
header h1{margin:0;font-size:28px;font-weight:700}
header p{margin:6px 0 0;font:14px system-ui,sans-serif;opacity:.8}
main{max-width:820px;margin:0 auto;padding:22px 16px 90px}
.sec{font:600 15px system-ui,sans-serif;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.q.right{border-left:6px solid var(--ok)}.q.wrong{border-left:6px solid var(--bad)}
.n{font:700 14px system-ui,sans-serif;color:var(--blue);margin-bottom:4px}
.txt{margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{background:var(--pale)}
.opt input{margin:0}.opt b{font:700 14px system-ui,sans-serif;color:var(--navy);width:16px}
.opt.sel{border-color:var(--blue);background:#e6eeff}
.opt.key{border-color:var(--ok);background:#e5f6ec}
.open input[type=text]{font:16px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:220px}
.open small{display:block;color:#5b6b8c;font:13px system-ui,sans-serif;margin-top:4px}
.fb{font:14px system-ui,sans-serif;margin-top:8px}.fb.r{color:var(--ok)}.fb.w{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;justify-content:center;align-items:center;font:15px system-ui,sans-serif}
button{font:600 15px system-ui,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.alt{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button:focus-visible,input:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
#score{font-weight:700;color:var(--navy)}
table{border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:5px 14px;text-align:center}
@media print{.bar{display:none}}
</style></head><body>
<header><div class="in"><div class="who">Tsalapatis Stavros</div><h1>Module 1 · Part 12</h1>
<p>SAT Math · Module 1 practice · 22 questions · 35 minutes · calculator allowed</p></div></header>
<main id="m"></main>
<div class="bar"><span id="prog">0 / 22 answered</span><button id="chk">Check answers</button><button class="alt" id="rst">Reset</button><span id="score"></span></div>
<script>
const Q=[{"q":"The sum of three consecutive integers is 129. What is the largest of the three integers?","opts":["41","42","43","44"],"ans":"D"},{"q":"If $a \\neq 0$, what is the solution for $x$ in the equation $a(x-2)+b=3ax-5$, in terms of $a$ and $b$?","ans":"A","opts":["$x=\\dfrac{b+5-2a}{2a}$","$x=\\dfrac{2a-b-5}{2a}$","$x=\\dfrac{b-5-2a}{2a}$","$x=\\dfrac{b+5+2a}{2a}$"]},{"q":"$$31(x-n)=31y+31n$$ One of the equations in a system of two linear equations is given, where $n$ is a positive constant. The system has no solution. Which equation could be the second equation in this system?","ans":"D","opts":["$3x - 3y = 6n$","$3x + 3y = 3n$","$3x + 3y = 6n$","$3x - 3y = 3n$"]},{"q":"For all values of $x$, $2m(4x+4) + k(2x+4) = -2x+1$, where $k$ and $m$ are constants. What is the value of $k+m$?","ans":"7/8","open":true},{"q":"A line in the $xy$-plane passes through the points $(0, 8)$ and $(4, 20)$. What is the $y$-coordinate of the $y$-intercept of the line?","open":true,"ans":"8"},{"q":"Tom wants to make more than 12% brine by mixing 400 g of 6% brine with some 15% brine. How many grams of 15% brine does he need to mix in?","ans":"D","opts":["Between 500 grams and 600 grams of 15% brine.","Between 600 grams and 700 grams of 15% brine.","Between 700 grams and 800 grams of 15% brine.","More than 800 grams of 15% brine."]},{"q":"A chemist has a 16% saline solution and a 25% saline solution. He wants to make 36 liters of a 20% saline solution by mixing a 16% solution and a 25% solution. If $a$ and $b$ are the liters of a 16% and 25% saline solution, respectively, which of the following system of equations is correct?","ans":"D","opts":["$\\begin{cases} a-b=36 \\\\ 0.16a+0.25b=0.2 \\end{cases}$","$\\begin{cases} a-b=36 \\\\ 16a+25b=20(a-b) \\end{cases}$","$\\begin{cases} a+b=36 \\\\ 0.16a+0.25b=a+b \\end{cases}$","$\\begin{cases} a+b=36 \\\\ 16a+25b=20(a+b) \\end{cases}$"]},{"q":"Min's motorcycle can travel 30 miles against the wind in the same amount of time that it takes him to cover 60 miles with the wind. The speed of the wind is 3 miles per hour. If $x$ is the speed, in miles per hour, of Min's motorcycle in still air, which of the following equations models this situation?","ans":"D","opts":["$\\dfrac{60}{x+3}+\\dfrac{30}{x-3}=1$","$\\dfrac{60}{x+3}-\\dfrac{30}{x-3}=1$","$\\dfrac{60}{x-3}-\\dfrac{30}{x+3}=1$","$\\dfrac{60}{x+3}=\\dfrac{30}{x-3}$"]},{"q":"Solve for $x$: $\\sqrt{x+9}=x-3$. (There is exactly one valid solution; watch for an extraneous root.)","ans":"7","open":true},{"q":"$f(x) = 4x^2 + 64x + 262$<br>The function $g$ is defined by $g(x) = f(x+5)$. For what value of $x$ does $g(x)$ reach its minimum?","ans":"A","opts":["$-13$","$-8$","$-5$","$-3$"]},{"q":"$$\\dfrac{\\sqrt[5]{x^6}}{\\sqrt[3]{x^2}} = x^{\\frac{a}{b}}$$If the equation above is true for all positive values of $x$, what is the value of $\\dfrac{a}{b}$? (Enter your answer as a fraction or as a decimal rounded to the nearest ten-thousandth.)","ans":"8/15","open":true},{"q":"Which of the following functions have zeros at $-2$ and $1$?<br>I. $f(x)=\\dfrac{x^2+x-2}{x-2}$<br>II. $g(x)=\\dfrac{x^3+x^2-2x}{x+2}$<br>III. $h(x)=\\dfrac{x+1}{x^2+x-2}$","ans":"A","opts":["I only","II only","III only","I and II only"]},{"q":"$$f(x)=2x+3$$ $$g(x)=7x-2$$ $$h(x)=5x+6$$ The functions $f$, $g$, and $h$ are defined as shown. If $f(x)\\cdot g(x)-h(x)=ax^2+bx+c$, where $a$, $b$, and $c$ are constants, what is the value of $b$?","ans":"B","opts":["$-5$","$12$","$20$","$22$"]},{"q":"The function $f$ is a quadratic function. In the $xy$-plane, the graph of $y=f(x)$ has a vertex at $(1, 9)$ and passes through the points $(2, 33)$ and $(-1, 105)$. What is the value of $f(-2)-f(0)$?","ans":"C","opts":["81","129","192","225"]},{"q":"<table class='qtable'><tr><th>$x$</th><th>$f(x)$</th></tr><tr><td>$-4$</td><td>3</td></tr><tr><td>$-2$</td><td>5</td></tr><tr><td>0</td><td>2</td></tr><tr><td>2</td><td>16</td></tr><tr><td>3</td><td>4</td></tr><tr><td>4</td><td>8</td></tr></table>The table above gives some values for the function $f$. If $g(x)=2f(x)$, what is the value of $k$ if $g(k)=8$?","ans":"B","opts":["$2$","$3$","$4$","$8$"]},{"q":"$$h(t)=-16t^2+b$$ The function $h$ estimates a ball's height, in feet, above a floor $t$ seconds after the ball is released, where $b$ is a constant. The function estimates that the ball is 19.36 feet above the floor when it is released at $t=0$. How many seconds after being released does the function estimate the ball will reach the floor?","ans":"1.1","open":true},{"q":"A committee of 3 people is chosen at random from a group of 5 men and 4 women (9 people total). What is the probability that all 3 people chosen are women?","ans":"A","opts":["$\\dfrac{1}{21}$","$\\dfrac{4}{9}$","$\\dfrac{1}{9}$","$\\dfrac{3}{9}$"]},{"q":"If $y$ varies inversely as $x$, and $y=4$ when $x=10$, what is the value of $x$ when $y=12$?","ans":"B","opts":["$\\dfrac{2}{5}$","$\\dfrac{10}{3}$","30","40"]},{"q":"A factory produces widgets at a constant rate. In 5 hours, it makes enough widgets to fill 8 boxes (each box holds the same number of widgets). At this same rate, how many boxes can it fill in 12.5 hours?","ans":"20","open":true},{"q":"A rectangle has side lengths of 9 and 12. What is the length of a diagonal of the rectangle?","open":true,"ans":"15"},{"q":"In the $xy$-plane, a circle has center $(-2, 3)$ and passes through the point $(1, 7)$. Which of the following is an equation of the circle?","opts":["$(x+2)^2+(y-3)^2 = 5$","$(x+2)^2+(y-3)^2 = 25$","$(x-2)^2+(y+3)^2 = 25$","$(x-2)^2+(y+3)^2 = 5$"],"ans":"B"},{"q":"The diagonal of a square has length $14\\sqrt{2}$. What is the area of the square?","opts":["140","168","196","224"],"ans":"C"}];
const SEC=[[0,'Algebra'],[8,'Advanced Math'],[16,'Problem-Solving and Data Analysis'],[19,'Geometry and Trigonometry']];
const given={};let checked=false;
function num(s){s=String(s).trim().replace(/\u2212/g,'-').replace(/,/g,'');
 let m=s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
 m=s.match(/^-?(\d+)?\.?\d+$/);return m?parseFloat(s):NaN}
function ok(q,g){if(g===undefined||g==='')return false;if(q.open){const a=num(q.ans),b=num(g);return !isNaN(b)&&Math.abs(a-b)<1e-4*Math.max(1,Math.abs(a))}return g===q.ans}
function render(){const m=document.getElementById('m');m.innerHTML='';
 Q.forEach((q,i)=>{const s=SEC.find(x=>x[0]===i);if(s){const h=document.createElement('div');h.className='sec';h.textContent=s[1];m.appendChild(h)}
  const d=document.createElement('div');d.className='q'+(checked?(ok(q,given[i])?' right':' wrong'):'');
  let h='<div class="n">Question '+(i+1)+'</div><div class="txt">'+q.q+'</div>';
  if(q.open){h+='<div class="open"><input type="text" inputmode="decimal" autocomplete="off" data-i="'+i+'" value="'+(given[i]||'')+'" '+(checked?'disabled':'')+' aria-label="Answer to question '+(i+1)+'"><small>Student-produced response. Fractions and decimals are accepted.</small></div>'}
  else{q.opts.forEach((o,k)=>{const L='ABCD'[k];const cls='opt'+(given[i]===L?' sel':'')+(checked&&q.ans===L?' key':'');
   h+='<label class="'+cls+'"><input type="radio" name="q'+i+'" data-i="'+i+'" value="'+L+'" '+(given[i]===L?'checked':'')+' '+(checked?'disabled':'')+'><b>'+L+'</b><span>'+o+'</span></label>'})}
  if(checked){const r=ok(q,given[i]);h+='<div class="fb '+(r?'r':'w')+'">'+(r?'Correct.':'Incorrect.')+' Answer: '+(q.open?q.ans:q.ans)+'</div>'}
  d.innerHTML=h;m.appendChild(d)});
 bind();typeset();prog()}
function bind(){document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{given[e.dataset.i]=e.value;render()});
 document.querySelectorAll('input[type=text]').forEach(e=>e.oninput=()=>{given[e.dataset.i]=e.value;prog()})}
function prog(){const n=Object.values(given).filter(v=>v!==''&&v!==undefined).length;document.getElementById('prog').textContent=n+' / 22 answered'}
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
document.getElementById('chk').onclick=()=>{checked=true;const c=Q.filter((q,i)=>ok(q,given[i])).length;document.getElementById('score').textContent='Score: '+c+' / 22';render();window.scrollTo(0,0)};
document.getElementById('rst').onclick=()=>{for(const k in given)delete given[k];checked=false;document.getElementById('score').textContent='';render();window.scrollTo(0,0)};
render();window.addEventListener('load',()=>setTimeout(typeset,600));
</script></body></html>
